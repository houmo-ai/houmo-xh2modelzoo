[pytest]
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -s
markers =
    transformer516: lightweight Transformers 5.16 workflow/recipe interface contracts
    transformer516_export: SHA-pinned Transformers 5.16 AutoRound block export
    qwen35_block: Qwen3.5 representative block export
    gemma4_block: Gemma4 representative block export
    ci_policy: changed-file to test impact policy checks
