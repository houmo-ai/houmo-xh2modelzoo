onnx-graphsurgeon = "^0.5.2"
onnxruntime = "^1.19.2"
onnxruntime-extensions = "^0.13.0"
onnxruntime-gpu = {version = "^1.20.1", source = "onnxruntime-cuda-11"}
onnxscript = "0.2.2"
onnxsim = "^0.4.36"
opencv-python-headless = "^4.10.0.84"
optimum = "1.24.0"
packaging = "^24.1"
pexpect = "^4.9.0"
pillow = "^10.4.0"
prettytable = "^3.11.0"
protobuf = "^3.20.3"
pyclipper = "^1.3.0.post6"
pycocotools = "^2.0.8"
pydot = "^3.0.2"
pynvml = "^12.0.0"
pytest = "^8.3.3"
