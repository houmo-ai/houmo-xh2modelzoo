# torchaudio = {version = "2.8.0", source = "pytorch_cu128"}
# torchvision = {version = "0.23.0", source = "pytorch_cu128"}
# onnxscript = "^0.4.0"
# onnxruntime = "^1.22.1"

[[tool.poetry.source]]
name = "onnxruntime-cuda-11"
priority = "supplemental"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-11/pypi/simple/"

[[tool.poetry.source]]
name = "pytorch_cu118"
priority = "explicit"
url = "https://download.pytorch.org/whl/cu118"

[[tool.poetry.source]]
name = "pytorch_cu128"
priority = "explicit"
url = "https://download.pytorch.org/whl/cu128"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["xh_model_zoo*", "xhmodel_merak*"]
where = ["."]

[tool.setuptools.package-data]
xh_model_zoo = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.txt",
  "**/*.so",
  "**/*.pt",
  "**/*.bin",
]
xhmodel_merak = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.txt",
  "**/*.so",
  "**/*.pt",
  "**/*.bin",
]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.commitizen]
major_version_zero = true
name = 'cz_conventional_commits'
tag_format = '$version'
update_changelog_on_bump = true
version_provider = 'pep621'
version_scheme = 'pep440'

[tool.docformatter]
black = true
blank = true
pre-summary-newline = true
recursive = true
wrap-descriptions = 0
wrap-summaries = 0

[tool.yamlfix]
explicit_start = false
line_length = 120
section_whitelines = 1
sequence_style = 'keep_style'
whitelines = 1

[tool.ruff]
# 设置最大行长
line-length = 120

[tool.ruff.lint]
# 其他 lint 设置...

[tool.ruff.format]
# 其他 format 设置...

[tool.black]
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  tests/data/
  | data/
  | profiling/
  | scripts/generate_schema.py  # Uses match syntax
)
'''
include = '\.pyi?$'
line-length = 120
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
ensure_newline_before_comments = true
# force_single_line = true
line_length = 120
profile = "black"
skip = ["data", ".*/", "build", "tmp", "work_dirs"]
# https://github.com/PyCQA/isort/blob/main/pyproject.toml

[tool.pylint.master]
load-plugins = ['pylint.extensions.docparams']

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 12
max-attributes = 20
max-locals = 30
min-public-methods = 0

[tool.pylint.typecheck]
generated-members = ['torch.*']

[tool.pylint.messages_control]
disable = [
  'logging-fstring-interpolation',
  'cyclic-import',
  'duplicate-code',
  'missing-module-docstring',
  'unnecessary-pass',
  'no-name-in-module',
]

[tool.pylint.BASIC]
good-names = ['bs', 'bn']

[tool.pyright]
reportMissingImports = false
reportMissingTypeStubs = false
reportWildcardImportFromLibrary = false
