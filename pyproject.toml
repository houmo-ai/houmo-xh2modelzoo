description = "Quanted Model Zoo toolkit for XH2a."
name = "xhmodel_zoo"
readme = "README.md"
requires-python = "~=3.12"
version = "1.0.0"

[tool.poetry]
package-mode = true
packages = [{ include = "xh_model_zoo" }, { include = "xhmodel_merak" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
torch = { version = ">=2.8.0, <2.9.0", source = "pytorch_cu128" }
torchaudio = { version = ">=2.8.0, <2.9.0", source = "pytorch_cu128" }
torchvision = { version = ">=0.23.0, <0.24.0", source = "pytorch_cu128" }

