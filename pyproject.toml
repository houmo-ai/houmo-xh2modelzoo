pyyaml = "^6.0.2"
qwen-vl-utils = "^0.0.10"
rich = "^13.8.1"
safetensors = "^0.4.5"
scipy = "^1.14.1"
seaborn = "^0.13.2"
sentencepiece = "^0.2.0"
setuptools = "^76.1.0"
shapely = "^2.0.6"
termcolor = "^2.4.0"
terminaltables = "^3.1.10"
tifffile = "^2024.9.20"
tiktoken = "^0.7.0"
torch = {version = "2.4.1", source = "pytorch_cu118"}
torch-tb-profiler = "^0.4.3"
torchaudio = {version = "2.4.1", source = "pytorch_cu118"}
torchvision = {version = "0.19.1", source = "pytorch_cu118"}
tqdm = "^4.66.5"
transformers = "4.51.0"
turbojpeg = "^0.0.2"
urllib3 = "^1.25"
yapf = "^0.40.2"

[[tool.poetry.source]]
name = "pytorch_cu118"
priority = "supplemental"
url = "https://download.pytorch.org/whl/cu118"

[[tool.poetry.source]]
name = "onnxruntime-cuda-11"
priority = "supplemental"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-11/pypi/simple/"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.black]
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  tests/data/
  | data/
  | profiling/
  | scripts/generate_schema.py  # Uses match syntax
)
'''
include = '\.pyi?$'
line-length = 120
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
ensure_newline_before_comments = true
force_single_line = true
line_length = 120
profile = "black"
skip = ["data", ".*/", "build", "tmp", "work_dirs"]
# https://github.com/PyCQA/isort/blob/main/pyproject.toml

[tool.pylint.master]
load-plugins = ['pylint.extensions.docparams']

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 12
max-attributes = 20
max-locals = 30
min-public-methods = 0

[tool.pylint.typecheck]
generated-members = ['torch.*']

[tool.pylint.messages_control]
disable = [
  'logging-fstring-interpolation',
  'cyclic-import',
  'duplicate-code',
  'missing-module-docstring',
  'unnecessary-pass',
  'no-name-in-module',
]

[tool.pylint.BASIC]
good-names = ['bs', 'bn']

[tool.pyright]
reportMissingImports = false
reportMissingTypeStubs = false
reportWildcardImportFromLibrary = false

# https://github.com/PyCQA/isort/blob/main/pyproject.toml
