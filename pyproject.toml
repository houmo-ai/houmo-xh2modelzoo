opencv-python-headless = "^4.10.0.84"
pillow = "^10.4.0"
pexpect = "^4.9.0"
onnx-graphsurgeon = "^0.5.2"
onnxsim = "^0.4.36"
onnxruntime = "^1.19.2"
cython = "^3.0.11"
einops = "^0.8.0"
safetensors = "^0.4.5"
transformers = "4.51.0"
tqdm = "^4.66.5"
tiktoken = "^0.7.0"
