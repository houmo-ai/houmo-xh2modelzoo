sentencepiece = "^0.2.0"
bitsandbytes = "0.45.0"


[[tool.poetry.source]]
name = "pytorch_cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "supplemental"

[[tool.poetry.source]]
name = "onnxruntime-cuda-11"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-11/pypi/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  tests/data/
  | data/
  | profiling/
  | scripts/generate_schema.py  # Uses match syntax
)
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["data", ".*/"]


# https://github.com/PyCQA/isort/blob/main/pyproject.toml