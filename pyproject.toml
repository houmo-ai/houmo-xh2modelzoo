  "vector-quantize-pytorch (>=1.23.2,<2.0.0)",
  "optimum (>=1.27.0,<2.0.0)",
  "accelerate (>=1.10.1,<2.0.0)",
  "compressed-tensors (>=0.12.2,<0.13.0)",
