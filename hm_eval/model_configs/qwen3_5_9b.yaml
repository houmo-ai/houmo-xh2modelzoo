# Qwen3.5-9B (Dense) 评测配置
config_id: qwen3_5_9b
display_name: Qwen3.5-9B
model_family: qwen3_5
architecture: Qwen3_5ForConditionalGeneration
hf_model_dir: /data01/datasets/Qwen3.5-9B
processor_class: AutoProcessor
transformers_version: "5.5.0"

recommended_datasets:
  - cmmmu
  - ceval
  - cmmlu
  - mmlu_pro
  - mmlu
  - gsm8k
  - math_500
  - humaneval
  - ifeval
  - arc
  - gpqa
  - bbh

backends:
  float:
    type: float
    model_class: Qwen3_5ForConditionalGeneration
    use_processor: true
    chat_template: processor
    extra_args:
      torch_dtype: bfloat16
      device_map: auto

  hmonnx:
    type: hmonnx
    onnx_model_type: qwen3_next
    export_meta_info: /data01/home/chenzx/project/xh2modelzoo/work_dirs/qwen3_5_9b_instruct_xh2a_2k/hmquant_xh2_qwen3.5-9b_w4a8_256_2k_448x448_20260520/golden_meta_info.json
    export_script: examples_merak/llm/qwen3_5/qwen3_5_workflow.py
    export_configs:
      - configs_merak/workflows/xh2a/llm_models/qwen3_5/9b/qwen3_5_9b_full.yaml
      - configs_merak/workflows/xh2a/llm_models/qwen3_5/9b/qwen3_5_9b_full_mtp.yaml
    extra_args: {}
