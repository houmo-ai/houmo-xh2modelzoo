# Qwen3.6-35B-A3B (对应 36B-A3B 落地目录) 评测配置
config_id: qwen3_6_35b_a3b
display_name: Qwen3.6-35B-A3B
model_family: qwen3_5_moe
architecture: Qwen3_5MoeForConditionalGeneration
hf_model_dir: /data01/datasets/Qwen3.6-35B-A3B
processor_class: AutoProcessor
transformers_version: "5.5.0"

recommended_datasets:
  - cmmmu
  - ceval
  - cmmlu
  - mmlu_pro
  - mmlu
  - gsm8k
  - math_500
  - humaneval
  - ifeval
  - arc
  - gpqa
  - bbh

backends:
  float:
    type: float
    model_class: Qwen3_5MoeForConditionalGeneration
    use_processor: true
    chat_template: processor
    extra_args:
      torch_dtype: bfloat16
      device_map: auto

  hmonnx:
    type: hmonnx
    onnx_model_type: qwen3_next
    export_meta_info: /data01/home/chenzx/project/xh2modelzoo/work_dirs/Qwen3.6-35B-A3B-XH2a-2k-w8a8h1_sefp/meta.json
    export_script: examples_merak/llm/qwen3_5_moe/qwen3_5_moe_xh_export_hmonnx.py
    export_configs:
      - configs/qwen3_5/qwen3_6_35b_a3b_xh2a.py
    extra_args: {}