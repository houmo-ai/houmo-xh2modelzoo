# Qwen3.5-27B (Dense) 评测配置
config_id: qwen3_5_27b
display_name: Qwen3.5-27B
model_family: qwen3_5
architecture: Qwen3_5ForConditionalGeneration
hf_model_dir: /data01/datasets/Qwen3.5-27B
processor_class: AutoProcessor
transformers_version: "5.5.0"

recommended_datasets:
  - cmmmu
  - ceval
  - cmmlu
  - mmlu_pro
  - mmlu
  - gsm8k
  - math_500
  - humaneval
  - ifeval
  - arc
  - gpqa
  - bbh

backends:
  float:
    type: float
    model_class: Qwen3_5ForConditionalGeneration
    use_processor: true
    chat_template: processor
    extra_args:
      torch_dtype: bfloat16
      device_map: auto

  hmonnx:
    type: hmonnx
    onnx_model_type: qwen3_next
    export_script: examples_merak/llm/qwen3_5/qwen3_5_xh_export_hmonnx.py
    export_configs:
      - configs_merak/xh2a/llm_models/qwen3_5/27b/qwen3_5_27b_instruct_xh2a_2k.py
      - configs_merak/xh2a/llm_models/qwen3_5/27b/qwen3_5_27b_instruct_xh2a_2k_1_layer.py
    extra_args: {}