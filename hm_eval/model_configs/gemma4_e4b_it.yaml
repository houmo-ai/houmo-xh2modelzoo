# Gemma-4-E4B-it 评测配置（统一 Gemma4 series Merak workflow）
config_id: gemma4_e4b_it
display_name: Gemma-4-E4B-it
model_family: gemma4_series
architecture: Gemma4ForConditionalGeneration
hf_model_dir: /data01/datasets/gemma-4-E4B-it
processor_class: AutoProcessor
transformers_version: "5.5.0"

recommended_datasets:
  - ceval
  - cmmmu
  - mmmu
  - mmlu_pro
  - mmlu
  - gpqa
  - gsm8k
  - math_500
  - humaneval
  - ifeval
  - arc
  - hellaswag
  - bbh
  - truthfulqa

normalize_choice_range: A-D
disable_thinking: true
max_tokens: 32

backends:
  float:
    type: float
    model_class: Gemma4ForConditionalGeneration
    use_processor: true
    chat_template: processor
    extra_args:
      torch_dtype: bfloat16
      device_map: auto

  hmonnx:
    type: hmonnx
    onnx_model_type: xhmodel_merak
    export_script: examples_merak/llm/gemma4_series/gemma4_workflow_demo.py
    export_config: configs_merak/workflows/xh2a/llm_models/gemma4_series/e4b/gemma4_e4b_full.yaml
    export_configs:
      - configs_merak/workflows/xh2a/llm_models/gemma4_series/e4b/gemma4_e4b_full.yaml
    export_meta_info: ${HM_EVAL_GEMMA4_E4B_HMONNX_META}
    sliding_window: true
    kv_cache_heterogeneous: true
    extra_args: {}
