quant:
  bits: 8

export:
  model:
    chip_arch: XH2a
    model_type: Qwen3ForCausalLM

    # null值仅用于占位，导出前会构造老版本config并提供真实的量化或原始模型路径
    hf_model: null

    model_name: xh2_qwen3-0.6b_w8a16_256_2k
    context_max_length: 2048
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    quant_scheme:
      quant_type: w8a16h1_sefp
      nodes:
        lm_head:
          quant_type: w8a16h1_sefp
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    only_first_block: false
