quant: null

export:
  model:
    chip_arch: XH2a
    model_type: Qwen2VLForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: mineru2_5_pro_2604_1_2b
    context_max_length: 4096
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    quant_scheme:
      quant_type: w8a16h0_ssfp
      nodes:
        lm_head:
          quant_type: w8a16h0_ssfp
      # 建议使用16-bit激活值matmul，否则attention会有严重的精度问题
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    visual_config:
      max_size_w: 1036
      max_size_h: 1036
      patch_size: 14
      quant_scheme:
        quant_type: w8a16h0_ssfp
        # 建议使用16-bit激活值matmul，否则attention会有严重的精度问题
        ops:
          MatMul:
            act_scheme:
              bits: 16
              fp_mode: sefp
            act_schema_2:
              bits: 16
              fp_mode: sefp
    only_first_block: false
  # 该字段用于导出多个不同尺寸的vit，属于minerU模型的自定义字段
  visual_buckets:
    model:
      chip_arch: XH2a
      model_type: Qwen2VLForConditionalGeneration_visual
      patch_size: 14
      quant_scheme:
        quant_type: w8a16h0_ssfp
        # 建议使用16-bit激活值matmul，否则attention会有严重的精度问题
        ops:
          MatMul:
            act_scheme:
              bits: 16
              fp_mode: sefp
            act_schema_2:
              bits: 16
              fp_mode: sefp
    buckets:
      # 5个常用尺寸.
      - max_size_h: 140
        max_size_w: 392
      - max_size_h: 168
        max_size_w: 1792
      - max_size_h: 392
        max_size_w: 2044
      - max_size_h: 560
        max_size_w: 560
      - max_size_h: 1036
        max_size_w: 392
      # - max_size_h: 196
      #   max_size_w: 560
      # - max_size_h: 280
      #   max_size_w: 784
      # - max_size_h: 392
      #   max_size_w: 1036
