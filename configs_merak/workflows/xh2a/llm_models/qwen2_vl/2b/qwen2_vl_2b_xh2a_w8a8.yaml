quant: null

export:
  model:
    chip_arch: XH2a
    model_type: Qwen2VLForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: qwen2_vl_2b
    context_max_length: 2048
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    visual_config:
      max_size_w: 448
      max_size_h: 448
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops:
          MatMul:
            act_scheme:
              bits: 16
              fp_mode: sefp
            act_schema_2:
              bits: 16
              fp_mode: sefp
    only_first_block: false
