quant:
  algorithm: gptqmodel
  method: gptq
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  preset: full_vlm
  bits: 4
  group_size: 64
  rotation: false
  hessian_mse: true
  calibration:
    jsonl: gptqmodel/quantization/calibration/dense_ivsg/gen_data/Qwen3.5-27B.jsonl
    text_key: text
    nsamples: 256
    seqlen: 1024
  runtime:
    batch_size: 1
    trust_remote_code: true
    device_map: auto
    offload_to_disk: false
  validation:
    check_quant_vision_demo: true
    check_rotation_ppl: false
  seed: 42
  quant_nontext_module: false
export:
  naming:
    family: qwen3_5
    variant: 9b
    profile: visual_only
    shape: '896'
  model:
    chip_arch: XH2a
    model_type: Qwen3_5ForConditionalGeneration_visual
    hf_model: weights/Qwen3.5-9B
    model_name: auto
    max_size_w: 896
    max_size_h: 896
    quant_scheme:
      quant_type: w8a8h1_sefp
      ops: {}
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
