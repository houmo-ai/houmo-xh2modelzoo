quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 8
  group_size: 64
  rotation: false
  calibration:
    dataset: NeelNanda/pile-10k
    nsamples: 128
    seqlen: 2048
  runtime:
    batch_size: 8
    trust_remote_code: true
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  iters: 200
  format: auto_gptq
export:
  model:
    chip_arch: XH2a
    model_type: Qwen3_5ForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: qwen3_5_2b
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 1
    linear_attention_mode: auto
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
    quant_scheme:
      quant_type: w8a16h1_sefp
      nodes:
        lm_head:
          quant_type: w8a16h1_sefp
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    visual_config:
      max_size_w: 448
      max_size_h: 448
      quant_scheme:
        quant_type: w8a16h1_sefp
        ops:
          MatMul:
            act_scheme:
              bits: 16
              fp_mode: sefp
            act_schema_2:
              bits: 16
              fp_mode: sefp
    only_first_block: false
