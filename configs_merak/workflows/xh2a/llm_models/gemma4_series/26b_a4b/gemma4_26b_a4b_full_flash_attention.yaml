quant:
  algorithm: gptqmodel
  method: gptq
  preset: full_multimodal
  rotation: null
  artifact_format: gptqmodel_hf
  output_format: gptqmodel_hf
  bits: 4
  group_size: 64
  sym: true
  iters: 200
  seed: 42
  quant_nontext_module: false
  calibration:
    jsonl: gptqmodel://quantization/calibration/moe_ebss/gen_data/Qwen3-Next-80B-A3B-Instruct.jsonl
    text_key: text
    nsamples: 256
    seqlen: 512
  runtime:
    batch_size: 1
    device_map: auto
    trust_remote_code: true
    offload_to_disk: false
  validation:
    check_quant_text_demo: true
    check_quant_image_demo: true
    check_quant_video_demo: false
    check_quant_audio_demo: false
  moe:
    routing: bypass
    routing_batch_size: null
export:
  model:
    chip_arch: XH2a
    model_type: Gemma4ForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: gemma_4_26b_a4b
    context_max_length: 262144
    prefill_chunk_length: 320
    attention_contract_version: 2
    max_mm_ranges_per_chunk: 1
    use_cache: true
    num_logits_to_keep: 1
    sliding_kv_cache_input_mode: slice_window
    quant_scheme:
      quant_type: w8a8h1_sefp
      ops: {}
    visual_config:
      export_mode: padded
      image_seq_length: 280
      max_patches: 2520
      patch_size: 16
      pooling_kernel_size: 3
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
      input_modality: image
    only_first_block: false
    video_visual_config:
      export_mode: padded
      image_seq_length: 70
      max_patches: 630
      patch_size: 16
      pooling_kernel_size: 3
      input_modality: video
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
