    chip_arch: XH2a
    model_type: Qwen3VLForConditionalGeneration_embedding
    hf_model: null
    model_name: qwen3_vl_embedding_2b
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 32768
    use_cache: true
    num_logits_to_keep: 0
    output_hidden_states_for_export: true
    quant_scheme:
      quant_type: w8a8h1_sefp
