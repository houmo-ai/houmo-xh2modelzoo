        MatMul:
          act_scheme:
            bits: 8
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    visual_config:
      max_size_w: 448
      max_size_h: 448
      max_size_t: 2
      patch_size: 16
      temporal_patch_size: 2
