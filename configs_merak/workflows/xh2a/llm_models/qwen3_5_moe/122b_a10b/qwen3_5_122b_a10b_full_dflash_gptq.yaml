quant:
  algorithm: gptqmodel
  method: gptq
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  preset: full_vlm
  bits: 4
  group_size: 64
  rotation: false
  hessian_mse: true
  calibration:
    jsonl: gptqmodel/quantization/calibration/moe_ebss/gen_data/Qwen3-Next-80B-A3B-Instruct.jsonl
    text_key: text
    nsamples: 512
    seqlen: 1024
  runtime:
    batch_size: 1
    trust_remote_code: true
    device_map: auto
    offload_to_disk: false
  validation:
    check_quant_vision_demo: true
    check_rotation_ppl: false
  seed: 42
  quant_nontext_module: false
  moe:
    attn_bits: 8
    shared_expert_bits: 8
    expert_bits: 4
    expert_down_bits: 4
    routing: bypass
export:
  model:
    chip_arch: XH2a
    model_type: Qwen3_5MoeForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: qwen3_5_122b_a10b
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 1
    linear_attention_mode: auto
    linear_chunk_size: 64
    flash_attention:
      enable: false
      q_bits: 8
      k_bits: 8
      v_bits: 8
      s_bits: 8
      p_bits: 8
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops: {}
    visual_config:
      max_size_w: 448
      max_size_h: 448
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    only_first_block: false
    spec_decode_mode: dflash
    num_draft_tokens: 9
    spec_draft_head_weight_bits: 4
    dflash_config:
      hf_model: weights/Qwen3.5-122B-A10B-DFlash
      # target_layer_ids come from this checkpoint config; do not duplicate them.
