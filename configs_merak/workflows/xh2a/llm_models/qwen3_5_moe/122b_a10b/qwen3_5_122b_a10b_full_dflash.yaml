quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  group_size: 64
  rotation: false
  calibration:
    jsonl: xh2modelzoo://data/calib_data/NeelNanda-pile-10k.jsonl
    nsamples: 128
    seqlen: 2048
  runtime:
    batch_size: 8
    gradient_accumulate_steps: 1
    trust_remote_code: true
    device_map: '0'
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  iters: 200
  format: auto_round:gptqmodel
  moe:
    attn_bits: 8
    shared_expert_bits: 8
export:
  model:
    chip_arch: XH2a
    model_type: Qwen3_5MoeForConditionalGeneration
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: qwen3_5_122b_a10b
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 1
    linear_attention_mode: auto
    linear_chunk_size: 64
    flash_attention:
      enable: false
      q_bits: 8
      k_bits: 8
      v_bits: 8
      s_bits: 8
      p_bits: 8
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops: {}
    visual_config:
      max_size_w: 448
      max_size_h: 448
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    only_first_block: false
    spec_decode_mode: dflash
    num_draft_tokens: 9
    spec_draft_head_weight_bits: 4
    output_hidden_state_indices:
    - 1
    - 7
    - 14
    - 20
    - 26
    - 32
    - 39
    - 45
    dflash_config:
      hf_model: weights/Qwen3.5-122B-A10B-DFlash
      target_model_dir: null
      mode: context
      hidden_size: 3072
      num_attention_heads: 32
      num_key_value_heads: 8
      head_dim: 128
      num_hidden_layers: 6
      num_target_layers: 8
      block_size: 16
      batch_size: 1
      input_sequence_length: 256
      max_pe_length: 262144
