quant:
  algorithm: gptqmodel
  method: gptq
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  preset: full_vlm
  bits: 4
  group_size: 64
  rotation: false
  hessian_mse: true
  calibration:
    jsonl: gptqmodel/quantization/calibration/moe_ebss/gen_data/Qwen3-Next-80B-A3B-Instruct.jsonl
    text_key: text
    nsamples: 512
    seqlen: 1024
  runtime:
    batch_size: 1
    trust_remote_code: true
    device_map: auto
    offload_to_disk: false
  validation:
    check_quant_vision_demo: true
    check_rotation_ppl: false
  seed: 42
  quant_nontext_module: false
  moe:
    attn_bits: 8
    shared_expert_bits: 8
    expert_bits: 4
    expert_down_bits: 5
    routing: bypass
export:
  model:
    chip_arch: XH2a
    model_type: Qwen3_5MoeForConditionalGeneration_visual
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: qwen3_6_35b_a3b
    max_size_w: 896
    max_size_h: 896
    quant_scheme:
      quant_type: w8a8h1_sefp
      ops: {}
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
