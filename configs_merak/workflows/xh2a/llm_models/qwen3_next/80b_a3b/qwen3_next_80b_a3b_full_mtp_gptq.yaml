export:
  model:
    chip_arch: XH2a
    hf_model: null
    context_max_length: 2048
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: false
    fuse_gdr_block_recurrent_ops: false
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops: {}
    only_first_block: false
    model_type: Qwen3NextForCausalLM
    model_name: qwen3_next_80b_a3b_instruct
    flash_attention:
      enable: false
      q_bits: 8
      s_bits: 8
    visual_config: null
    spec_decode_mode: mtp
    num_draft_tokens: 4
    spec_draft_head_weight_bits: 4
    output_post_norm_hidden: true
    mtp_config:
      hidden_size: 2048
      num_key_value_heads: 2
      head_dim: 256
      batch_size: 1
      input_sequence_length: 1
      context_max_length: 2048
      max_pe_length: 262144
      use_cache: true
quant:
  algorithm: gptqmodel
  method: gptq
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  group_size: 64
  rotation: false
  calibration:
    jsonl: gptqmodel://quantization/calibration/moe_ebss/gen_data/Qwen3-Next-80B-A3B-Instruct.jsonl
    text_key: text
    nsamples: 512
    seqlen: 1024
  runtime:
    batch_size: 1
    trust_remote_code: true
    device_map: auto
    auto_forward_data_parallel: false
  validation:
    check_saved_precision: false
    min_logit_cosine: 0.99
    require_top1_match: true
    skip_ppl: false
  moe:
    self_attn_bits: 8
    linear_attn_bits: 8
    dense_mlp_bits: 4
    shared_expert_bits: 8
    expert_bits: 4
