quant: null

export:
  target_device: XH2a
  model:
    type: XHKokoroModel

  graph_mode: bucketed_precision_split
  # Four production capacity gears: T32/F160, T64/F320,
  # T128/F640, and T256/F1280. Host retries the next gear only when the
  # predicted duration exceeds the current F capacity.
  token_buckets: [32, 64, 128, 256]
  audio_seconds_buckets: [4, 8, 16, 32]
  lstm_variants: [native, decomposed]

  opset: 17
  seed: 1234
  simplify: false
  convert_hmonnx: true
  allow_decomposed_failure: true
  # Required to inline pkg.onnxscript.torch_lib functions in decomposed LSTM
  # exports. This is exporter normalization, not a Kokoro post-export rewrite.
  torch_onnx_internal_optimize: true

  # Real HMONNX audio/spectrum validation rejects W16A16 phase accumulation.
  # Keep only CumSum -> phase interpolation -> Sin on Host FP32.
  phase_on_npu: false
  stft_pad_mode: length_aware_reflect
  stft_phase_mode: cordic
  f0_norm_mode: adain

  components:
    text_duration:
      quant_type: w16a16_sefp
    frame_acoustic:
      quant_type: w16a16_sefp
    generator_istft:
      quant_type: w16a16_sefp
