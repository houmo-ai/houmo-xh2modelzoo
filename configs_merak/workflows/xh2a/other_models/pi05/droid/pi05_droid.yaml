quant: null

export:
  target_device: XH2a
  variant: droid
  config_dir: /data02/datasets/paligemma-3b-pt-224
  prompt: 请解释Gemma模型的核心优势是什么？
  components:
    - vision
    - gemma
    - expert
    - other
  quant_types:
    vision: w8a8h1_sefp
    gemma: w8a8h1_sefp
    expert: w8a8h1_sefp
    other: w8a8h1_sefp
  model:
    type: XHGemmaLLMModel
    hf_model: null
    wrap_cfg:
      max_sequence_length: 1024
      input_sequence_length: 640
      use_cache: true
      num_logits_to_keep: 1
      kv_cache:
        cache_axis: 2
    quant_config: {}
    frontend_type: TorchFX
    export_cfg:
      input_names:
        - inputs_embeds
        - past_seq_length
        - current_input_length
        - attention_mask
      output_names:
        - last_hidden_state
  expert_model:
    type: XHGemma05CLLMModel
    hf_model: null
    wrap_cfg:
      max_sequence_length: 1024
      input_sequence_length: 15
      use_cache: true
      num_logits_to_keep: 1
      kv_cache:
        cache_axis: 2
    quant_config: {}
    frontend_type: TorchFX
    export_cfg:
      input_names:
        - inputs_embeds
        - past_seq_length
        - current_input_length
        - cond
        - attention_mask
      output_names:
        - last_hidden_state
  vision:
    input_shape:
      - 1
      - 3
      - 224
      - 224
    opset: 17
  other:
    sequence_length: 50
    hidden_size: 1024
    opset: 17
